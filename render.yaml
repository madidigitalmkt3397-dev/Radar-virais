services:
  - type: web
    name: radar-de-virais
    env: python
    region: ohio
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      cd frontend
      npm install
      npm run build
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: YOUTUBE_API_KEY
        sync: false